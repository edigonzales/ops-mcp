# Synthetische Fixture des AGI Ops-Agenten. Keine echten Betriebsdaten, keine echten
# Hosts, keine Tokens, keine Benutzerkennungen. Erzeugt fuer die Abnahmeszenarien T01-T12.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-service-b
  namespace: fixture-service-b-integration
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: service-b
          image: registry.fixture.invalid/fixture/service-b:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: ${INITIAL_DELAY_SECONDS}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
