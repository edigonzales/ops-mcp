# Synthetische Fixture des AGI Ops-Agenten. Keine echten Betriebsdaten, keine echten
# Hosts, keine Tokens, keine Benutzerkennungen. Erzeugt fuer die Abnahmeszenarien T01-T12.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-modelfinder
  namespace: fixture-integration
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: modelfinder
          image: registry.fixture.invalid/fixture/modelfinder:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: ${PROBE_PATH}
              port: 8080
            initialDelaySeconds: ${INITIAL_DELAY_SECONDS}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: ${FAILURE_THRESHOLD}
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: ${PROBE_PATH}
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
