# Synthetische Fixture des AGI Ops-Agenten. Keine echten Betriebsdaten, keine echten
# Hosts, keine Tokens, keine Benutzerkennungen. Erzeugt fuer die Abnahmeszenarien T01-T12.
# HEAD-Variante B: andere Probe-Werte. Ausdruecklich KEIN Ersatz fuer Commit A.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-modelfinder
  namespace: fixture-integration
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: modelfinder
          image: registry.fixture.invalid/fixture/modelfinder:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: ${PROBE_PATH}
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: ${PROBE_PATH}
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
