# Versionskatalog des AGI Ops-Agent V1 (AGENTS.md Abschnitt 3: "Versionen stehen in
# gradle/libs.versions.toml").
#
# Diese Datei dokumentiert die tatsaechlich verwendeten, fest gepinnten Versionen. Keine
# dynamischen Angaben, kein "latest". Die aufgeloesten Laufzeit- und Testversionen wurden mit
#   ./gradlew dependencyReport --console=plain
# gegen build/dependency-report.txt geprueft (Java 25.0.2, Gradle 9.8.1).
#
# Hinweis: build.gradle pinnt die direkten Abhaengigkeiten derzeit als Zeichenketten. Der
# Katalog ist die gemeinsame, kommentierte Versionsquelle; die Umstellung von build.gradle auf
# die Katalog-Accessoren ist ein eigener Schritt und wurde hier bewusst nicht vorgenommen.
# Direkte Abhaengigkeiten sind mit "direkt" markiert, nur transitive mit "transitiv".

[versions]
# --- Werkzeuge (keine Bibliothek, sondern die verwendete Toolchain) ---
java = "25"                                     # Sprach-/Bytecode-Stand; build.gradle: release 25, sourceCompatibility 25
gradle = "9.8.1"                                # eingecheckter Wrapper (gradle/wrapper/gradle-wrapper.properties)

# --- Direkte Abhaengigkeiten aus build.gradle ---
mcp = "2.0.1"                                   # direkt: io.modelcontextprotocol.sdk:mcp (offizielles MCP-Java-SDK, stdio-Transport)
jackson = "3.1.4"                               # direkt: tools.jackson.core:jackson-databind und tools.jackson.dataformat:jackson-dataformat-yaml (Jackson 3, Paket tools.jackson.*)
jsonSchemaValidator = "3.0.6"                   # direkt: com.networknt:json-schema-validator; arbeitet mit Jackson 3 (tools.jackson.databind.JsonNode)
slf4j = "2.0.17"                                # direkt: org.slf4j:slf4j-api (implementation) und org.slf4j:slf4j-simple (runtimeOnly, Logs auf stderr)
junit = "5.14.1"                                # direkt (Test): org.junit.jupiter:junit-jupiter

# --- Testlaufzeit ---
junitPlatform = "1.14.1"                        # direkt (Test): org.junit.platform:junit-platform-launcher passend zu JUnit 5.14.1

# --- Transitive Aufloesung (im Bericht nachgewiesen, nicht selbst deklariert) ---
jacksonCore = "3.1.4"                           # transitiv: tools.jackson.core:jackson-core, von databind/yaml/dataformat gezogen
jacksonBom = "3.1.4"                            # transitiv: tools.jackson:jackson-bom als Plattformkonstante
jacksonAnnotations = "2.21"                     # transitiv: com.fasterxml.jackson.core:jackson-annotations (Jackson-2-Annotationen, weiterhin von Jackson 3 verwendet)
snakeyamlEngine = "3.0.1"                       # transitiv: org.snakeyaml:snakeyaml-engine, YAML-Backend von jackson-dataformat-yaml; Grundlage des begrenzten ConfigLoaders
itu = "1.14.0"                                  # transitiv: com.ethlo.time:itu, RFC3339-Zeitparser von json-schema-validator (format: date-time)
mcpCore = "2.0.1"                               # transitiv: io.modelcontextprotocol.sdk:mcp-core, Protokollkern des MCP-SDK
mcpJsonJackson3 = "2.0.1"                       # transitiv: io.modelcontextprotocol.sdk:mcp-json-jackson3, JSON-Bindung des MCP-SDK an Jackson 3
reactorCore = "3.7.0"                           # transitiv: io.projectreactor:reactor-core, reaktive Basis des MCP-SDK
reactiveStreams = "1.0.4"                       # transitiv: org.reactivestreams:reactive-streams, API-Vertrag von reactor-core
junitBom = "5.14.1"                             # transitiv (Test): org.junit:junit-bom als Plattformkonstante
opentest4j = "1.3.0"                            # transitiv (Test): org.opentest4j:opentest4j, Assertion-Fehler der JUnit-Plattform

[libraries]
# Direkte Laufzeitabhaengigkeiten
mcp = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp" }                              # MCP-Protokoll und stdio-Transport; keine eigene JSON-RPC-Implementierung
jacksonDatabind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }         # Jackson 3, Paket tools.jackson.databind
jacksonDataformatYaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" } # YAML-Konfiguration und Fixturen, nicht ausfuehrender Parser
jsonSchemaValidator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }    # Pruefung der Schemas in schemas/
slf4jApi = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }                                   # Logging-Fassade; stdout bleibt ausschliesslich MCP-JSON-RPC
slf4jSimple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }                             # Binding, das auf stderr schreibt (runtimeOnly)

# Direkte Testabhaengigkeiten
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }                   # JUnit 5 Aggregat (api, params, engine)
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" } # Testausfuehrung durch Gradle

# Transitive Abhaengigkeiten (dokumentiert, damit Versionskonflikte sichtbar bleiben)
jacksonCore = { module = "tools.jackson.core:jackson-core", version.ref = "jacksonCore" }
jacksonBom = { module = "tools.jackson:jackson-bom", version.ref = "jacksonBom" }
jacksonAnnotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jacksonAnnotations" }
snakeyamlEngine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyamlEngine" }
itu = { module = "com.ethlo.time:itu", version.ref = "itu" }
mcpCore = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcpCore" }
mcpJsonJackson3 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson3", version.ref = "mcpJsonJackson3" }
reactorCore = { module = "io.projectreactor:reactor-core", version.ref = "reactorCore" }
reactiveStreams = { module = "org.reactivestreams:reactive-streams", version.ref = "reactiveStreams" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }

[bundles]
runtime = ["mcp", "jacksonDatabind", "jacksonDataformatYaml", "jsonSchemaValidator", "slf4jApi"]       # Laufzeitkern; slf4jSimple bleibt runtimeOnly
testing = ["junitJupiter", "junitPlatformLauncher"]                                                    # deterministische Tests ohne Netz, ohne LLM-Schluessel
